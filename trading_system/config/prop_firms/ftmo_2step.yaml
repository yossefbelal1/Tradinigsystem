name: "FTMO (2-Step Evaluation)"
official_source: "https://ftmo.com/en/trading-objectives/"
verification_date: "2026-10-15"
platform: "MetaTrader 5"
mt5_compatible: true
supported_instruments: ["Forex", "Metals", "Indices", "Commodities", "Crypto"]
phases: 2

# Drawdown architecture
drawdown_type: "static"           # Static floor from initial balance ($90k on $100k)
max_drawdown_pct: 10.0            # 10% max allowable loss
daily_loss_limit_pct: 5.0         # 5% maximum loss per day
daily_loss_basis: "equity_and_balance" # Evaluated vs 23:59:59 CE(S)T midnight baseline

# Profit milestones
profit_target_phase1_pct: 10.0
profit_target_phase2_pct: 5.0

# Time constraints
min_trading_days: 4
max_trading_days: null            # Unlimited duration

# Execution permissions & verified policies
verified_rules:
  - "Static maximum loss of 10% of the initial account balance"
  - "Maximum daily loss of 5% of starting day equity/balance at 23:59:59 CE(S)T"
  - "Phase 1 profit target 10%, Phase 2 profit target 5%"
  - "Minimum 4 active trading days per phase"
  - "No maximum time limit to complete evaluation"
  - "Payout split starts at 80% (up to 90% via scaling plan)"
  - "First payout eligible after 14 calendar days"

assumed_rules:
  - "News trading allowed on FTMO Swing accounts (restricted on FTMO Standard within 2 minutes of major news)"
  - "Weekend holding allowed on FTMO Swing accounts"
