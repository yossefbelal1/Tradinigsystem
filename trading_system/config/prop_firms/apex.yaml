max_drawdown_pct: 6.0
daily_loss_limit_pct: null         # Apex has no daily loss limit
daily_loss_basis: null

# Profit milestones
profit_target_phase1_pct: 6.0
profit_target_phase2_pct: null

# Time constraints
min_trading_days: null
max_trading_days: null

verified_rules:
  - "NOT COMPATIBLE with MetaTrader 5 (CME Futures only via Rithmic/Tradovate)"
  - "Intraday Trailing Threshold trails the highest peak unrealized profit in real-time"
  - "Trailing threshold stops trailing at starting balance + $100"
  - "No daily loss limit during evaluation"
  - "Positions must be closed before 16:59 ET"
  - "News trading allowed"

assumed_rules:
  - "Contracts allowed scaled by account size tier (e.g. 10 contracts on $50k)"
