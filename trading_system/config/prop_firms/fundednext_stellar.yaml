name: "FundedNext (Stellar 2-Step)"
platform: "MetaTrader 5"
mt5_compatible: true
supported_instruments: ["Forex", "Metals", "Indices", "Commodities", "Crypto"]
phases: 2

# Drawdown architecture
drawdown_type: "static"           # Static 10% calculated from initial deposit
max_drawdown_pct: 10.0
daily_loss_limit_pct: 5.0
daily_loss_basis: "balance"       # Based on start-of-day balance

# Profit milestones
profit_target_phase1_pct: 8.0
profit_target_phase2_pct: 5.0

# Time constraints
min_trading_days: 5
max_trading_days: null

# Execution permissions
consistency_rule: false
news_trading_allowed: true
weekend_holding_allowed: true
scaling_plan: true
payout_split_pct: 85.0
first_payout_days: 14
challenge_profit_share_pct: 15.0
