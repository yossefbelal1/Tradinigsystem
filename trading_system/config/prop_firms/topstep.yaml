name: "Topstep (CME Futures Trading Combine)"
official_source: "https://help.topstep.com/"
verification_date: "2026-10-15"
platform: "cme_futures"
mt5_compatible: false
futures_warning: "WARNING: Topstep operates exclusively on CME/COMEX/NYMEX Futures (GC, NQ, ES, CL, 6E) via Tradovate/NinjaTrader. It does NOT support MT5 or spot Forex/CFD."
supported_instruments: ["GC Gold Futures", "NQ Nasdaq Futures", "ES S&P Futures", "CL Crude Oil Futures", "6E Euro FX Futures"]
phases: 1

# Drawdown architecture
drawdown_type: "eod_trailing"      # Trails high-water mark calculated at End-of-Day (EOD)
max_drawdown_pct: 4.0
daily_loss_limit_pct: 2.0          # Hard daily loss pause
daily_loss_basis: "balance"

# Profit milestones
profit_target_phase1_pct: 6.0
profit_target_phase2_pct: null

# Time constraints
min_trading_days: null
max_trading_days: null

verified_rules:
  - "NOT COMPATIBLE with MetaTrader 5 (CME Futures only via Tradovate/NinjaTrader)"
  - "EOD Trailing Maximum Loss limit (ratchets up based on end-of-day balance)"
  - "Trailing stop locks in at initial balance once profit target is reached"
  - "Consistency target: Best day profit cannot exceed 50% of total profit target"
  - "Mandatory flatten all positions before 15:10 CT daily close"

assumed_rules:
  - "Contract margin limits as posted on Topstep instrument specification table"
